<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>화선 스튜디오 · HWASEON STUDIO</title>
<meta name="description" content="화선 스튜디오 — 인연(Inyeon)과 내 진짜 목소리를 만드는 작은 인디 스튜디오. 두 앱 모두 무료이고, 입력한 것은 기기 밖으로 나가지 않습니다." />
<meta property="og:title" content="화선 스튜디오 · HWASEON STUDIO" />
<meta property="og:description" content="사주로 보는 최애와의 궁합 「인연」, 음역대를 재는 「내 진짜 목소리」. 화선 스튜디오가 만듭니다." />
<meta property="og:url" content="https://hwaseonstudio.com/" />
<link rel="canonical" href="https://hwaseonstudio.com/" />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --canvas: #0E0D14;
    --surface: #1A1820;
    --card: #221F2B;
    --text: #F5F2EC;
    --muted: #A7A1B5;
    --divider: #2A2632;
    --lavender: #7B6FCF;
    --gold: #FFD56B;
    --violet: #7C5CFC;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--canvas);
    color: var(--text);
    font-family: 'Inter', 'Noto Sans KR', -apple-system, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
  a { color: inherit; text-decoration: none; }

  .glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(600px circle at 80% -5%, rgba(123,111,207,0.18), transparent 60%),
      radial-gradient(500px circle at 5% 20%, rgba(255,213,107,0.08), transparent 55%);
  }
  .content { position: relative; z-index: 1; }

  nav {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(14px);
    background: rgba(14,13,20,0.72);
    border-bottom: 1px solid var(--divider);
  }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: 0.02em; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--lavender), var(--gold));
    display: grid; place-items: center; font-size: 16px; font-weight: 900; color: #1a1820;
  }
  .nav-right { display: flex; align-items: center; gap: 28px; }
  .nav-links { display: flex; gap: 28px; font-size: 14px; color: var(--muted); }
  .nav-links a:hover { color: var(--text); }
  @media (max-width: 680px) { .nav-links { display: none; } }

  /* lang toggle */
  .lang-toggle {
    display: inline-flex; border: 1px solid var(--divider); border-radius: 999px; overflow: hidden;
    font-size: 13px; font-weight: 600;
  }
  .lang-toggle button {
    background: transparent; border: none; color: var(--muted); cursor: pointer;
    padding: 7px 14px; font-family: inherit; font-weight: 600; transition: all .15s ease;
  }
  .lang-toggle button.active { background: var(--lavender); color: #fff; }

  header.hero { padding: 96px 0 72px; text-align: center; }
  .eyebrow {
    display: inline-block; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lavender); font-weight: 600; margin-bottom: 22px;
    padding: 6px 14px; border: 1px solid var(--divider); border-radius: 999px;
  }
  .hero h1 {
    font-size: clamp(40px, 8vw, 76px); line-height: 1.04; font-weight: 900;
    letter-spacing: -0.02em; margin-bottom: 22px;
  }
  .hero h1 .accent {
    background: linear-gradient(120deg, var(--lavender), var(--gold));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero p.lead { font-size: clamp(16px, 2.4vw, 20px); color: var(--muted); max-width: 580px; margin: 0 auto 36px; }
  .hero p.lead b { color: var(--text); font-weight: 700; }
  .cta-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 26px; border-radius: 14px; font-weight: 700; font-size: 15px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary { background: var(--lavender); color: #fff; box-shadow: 0 8px 30px rgba(123,111,207,0.35); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 38px rgba(123,111,207,0.5); }
  .btn-ghost { border: 1px solid var(--divider); color: var(--text); }
  .btn-ghost:hover { border-color: var(--lavender); }

  .trust { display: flex; gap: 12px; justify-content: center; margin-top: 56px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 11px 20px; border-radius: 999px;
    border: 1px solid var(--divider); background: var(--card);
    font-size: 14.5px; font-weight: 600; color: var(--muted);
  }
  .chip svg { width: 15px; height: 15px; color: var(--lavender); flex-shrink: 0; }

  section { padding: 80px 0; }
  .sec-label { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--lavender); font-weight: 600; margin-bottom: 14px; }
  .sec-title { font-size: clamp(28px, 5vw, 44px); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 18px; }
  .sec-sub { color: var(--muted); max-width: 620px; font-size: 17px; }

  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 44px; }
  @media (max-width: 760px) { .grid3 { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--divider); border-radius: 20px; padding: 28px;
    transition: border-color .2s ease, transform .2s ease;
  }
  .card:hover { border-color: var(--lavender); transform: translateY(-3px); }
  .card .ic { font-size: 28px; margin-bottom: 14px; }
  .card h3 { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
  .card p { color: var(--muted); font-size: 15px; }

  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 44px; align-items: start; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }

  .prod {
    background: linear-gradient(165deg, var(--surface), var(--card));
    border: 1px solid var(--divider); border-radius: 24px; padding: 34px 30px;
    display: flex; flex-direction: column; height: 100%;
    transition: border-color .2s ease, transform .2s ease;
  }
  .prod:hover { border-color: var(--lavender); transform: translateY(-3px); }
  .prod-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .prod-ic {
    width: 52px; height: 52px; border-radius: 15px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 24px; font-weight: 700; color: #17141f;
  }
  .prod-ic.inyeon { background: linear-gradient(135deg, var(--lavender), var(--gold)); }
  .prod-ic.voice  { background: linear-gradient(135deg, var(--violet), #59C2E8); color: #fff; }
  .prod-head h3 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.25; }
  .prod-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .prod-desc { color: var(--muted); font-size: 15.5px; }

  .feat { list-style: none; margin-top: 22px; display: flex; flex-direction: column; gap: 13px; }
  .feat li { display: flex; gap: 11px; align-items: flex-start; color: var(--muted); font-size: 15px; }
  .feat li b { color: var(--text); font-weight: 700; }
  .feat .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lavender); margin-top: 8px; flex-shrink: 0; }
  .prod.voice .feat .dot { background: var(--violet); }

  .store-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
  .store-btn {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 11px 17px; border-radius: 13px; font-size: 14px; font-weight: 700;
    border: 1px solid var(--divider); background: rgba(255,255,255,0.03);
    transition: border-color .15s ease, transform .15s ease, background .15s ease;
  }
  .store-btn:hover { border-color: var(--lavender); background: rgba(255,255,255,0.07); transform: translateY(-2px); }
  .store-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .store-btn .sb-kicker { display: block; font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.2; }

  .note {
    margin-top: auto; padding-top: 22px;
    color: #7E7890; font-size: 12.5px; line-height: 1.55;
  }

  .band { text-align: center; padding: 90px 0; }
  .band h2 { font-size: clamp(28px, 5vw, 46px); font-weight: 900; letter-spacing: -0.02em; margin-bottom: 16px; }
  .band p { color: var(--muted); font-size: 18px; margin-bottom: 30px; }

  footer { border-top: 1px solid var(--divider); padding: 44px 0; }
  footer .wrap { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  footer .muted { color: var(--muted); font-size: 14px; }
  footer a.link { color: var(--muted); font-size: 14px; }
  .foot-links { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  footer a.link:hover { color: var(--lavender); }
</style>
</head>
<body>
<div class="glow"></div>
<div class="content">

  <nav>
    <div class="wrap">
      <div class="brand"><span class="mark">花</span> HWASEON STUDIO</div>
      <div class="nav-right">
        <div class="nav-links">
          <a href="#about" data-ko="소개" data-en="About">소개</a>
          <a href="#products" data-ko="제품" data-en="Products">제품</a>
          <a href="#contact" data-ko="연락처" data-en="Contact">연락처</a>
        </div>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button id="btn-ko" onclick="setLang('ko')">KO</button>
          <button id="btn-en" onclick="setLang('en')">EN</button>
        </div>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="wrap">
      <span class="eyebrow">花仙 · Hwaseon Studio</span>
      <h1 data-ko="나를 읽는 앱,<br /><span class='accent'>내 기기 안에서</span>"
          data-en="Apps that read you —<br />all <span class='accent'>on your device</span>"></h1>
      <p class="lead"
         data-ko="사주로 최애와의 인연을 읽는 <b>인연</b>, 목소리로 타고난 음역대를 찾는 <b>내 진짜 목소리</b>. 두 앱 모두 회원가입이 없고, 입력한 것이 기기 밖으로 나가지 않습니다."
         data-en="<b>Inyeon</b> reads your bond with your bias through Korean Saju. <b>My Voice Coach</b> finds the vocal range you were born with. Neither asks you to sign up, and neither sends what you enter anywhere."></p>
      <div class="cta-row">
        <a href="#products" class="btn btn-primary" data-ko="앱 보러 가기 →" data-en="See our apps →"></a>
        <a href="#contact" class="btn btn-ghost" data-ko="함께하기" data-en="Work with us"></a>
      </div>
      <div class="trust">
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-ko="회원가입 없음" data-en="No sign-up"></span></span>
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-ko="서버 없음" data-en="No servers"></span></span>
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-ko="전부 기기 안에서" data-en="All on-device"></span></span>
      </div>
    </div>
  </header>

  <section id="about">
    <div class="wrap">
      <div class="sec-label">About</div>
      <h2 class="sec-title" data-ko="우리는 화선 스튜디오" data-en="We are Hwaseon Studio"></h2>
      <p class="sec-sub"
         data-ko="두 명의 공동 창업자가 시작한 작은 인디 스튜디오. 나에 대해 알려주는 앱을 만들되, 그 정보가 우리에게는 오지 않도록 만듭니다."
         data-en="A small indie studio founded by two co-founders. We build apps that tell you something about yourself — and make sure that something never reaches us."></p>
      <div class="grid3">
        <div class="card">
          <div class="ic">🔒</div>
          <h3 data-ko="기기 안에서 끝냅니다" data-en="It ends on your device"></h3>
          <p data-ko="두 앱 모두 서버가 없습니다. 생년월일도, 마이크로 들어온 목소리도 기기 밖으로 나가지 않고, 만들 계정도 없습니다."
             data-en="Neither app has a backend. Your birth date and the audio from your mic never leave the device, and there's no account to create."></p>
        </div>
        <div class="card">
          <div class="ic">🎛️</div>
          <h3 data-ko="재료는 달라도 방식은 같습니다" data-en="Different material, same method"></h3>
          <p data-ko="사주명리와 오행은 산식으로, 목소리는 자기상관 피치 검출로 풉니다. 다루는 재료는 다르지만, 결과가 어디서 나왔는지 설명할 수 있게 만드는 건 같습니다."
             data-en="Saju and the five elements become formulas; your voice becomes autocorrelation pitch detection. Different material, but the same rule — we should be able to explain where a result came from."></p>
        </div>
        <div class="card">
          <div class="ic">🤝</div>
          <h3 data-ko="두 사람이 만듭니다" data-en="Two people make it"></h3>
          <p data-ko="공동 창업자 두 명이 기획부터 디자인, 개발, 출시까지 직접 합니다. 그래서 앱이 작고, 고칠 것이 생기면 바로 고칩니다."
             data-en="Two co-founders handle everything from concept to design, code, and release. That's why the apps stay small — and why fixes ship fast."></p>
        </div>
      </div>
    </div>
  </section>

  <section id="products">
    <div class="wrap">
      <div class="sec-label">Products</div>
      <h2 class="sec-title" data-ko="지금 만나볼 수 있는 앱" data-en="Apps you can try today"></h2>
      <p class="sec-sub"
         data-ko="둘 다 무료이고, 지금 스토어에서 받을 수 있습니다."
         data-en="Both are free, and both are on the stores right now."></p>

      <div class="grid2">

        <article class="prod">
          <div class="prod-head">
            <div class="prod-ic inyeon">緣</div>
            <div>
              <h3 data-ko="인연" data-en="Inyeon"></h3>
              <div class="prod-sub" data-ko="Inyeon: Idol Match" data-en="인연 · Idol Match"></div>
            </div>
          </div>
          <p class="prod-desc"
             data-ko="생년월일을 사주로 읽고, 내가 정한 최애의 사주와 맞춰 오늘의 궁합을 숫자 하나로 보여줍니다. 검색할 아이돌 목록은 없습니다 — 누구든 최애가 될 수 있어요."
             data-en="Inyeon reads your birth date through Korean Saju, pairs it with your bias's, and gives you one number for today. There's no idol list to search — anyone can be your bias."></p>
          <ul class="feat">
            <li><span class="dot"></span><span
                data-ko="<b>오늘의 인연 지수</b> — 나의 오행, 최애의 오행, 그날의 기운을 함께 계산"
                data-en="<b>Today's match</b> — your element, your bias's element, and the energy of the day"></span></li>
            <li><span class="dot"></span><span
                data-ko="<b>최애 카드</b> — 일간과 띠, 주도하는 오행을 한눈에"
                data-en="<b>Your bias card</b> — day stem, zodiac animal, and dominant element at a glance"></span></li>
            <li><span class="dot"></span><span
                data-ko="<b>주간 히스토리와 연속 기록</b> — 한 주의 흐름과 가장 좋았던 날"
                data-en="<b>Weekly history &amp; streaks</b> — the week's flow and your peak day"></span></li>
            <li><span class="dot"></span><span
                data-ko="<b>행운의 색과 시간대</b> — 오늘 나에게 맞는 시간, 쉬어갈 시간"
                data-en="<b>Lucky info</b> — today's color, the hours that favor you and the ones to sit out"></span></li>
          </ul>
          <div class="store-row">
            <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.hwaseonstudio.inyeon" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#00D4FF" d="M3.6 1.8a1.9 1.9 0 0 0-.5 1.4v17.6c0 .6.2 1.1.5 1.4l.1.1 9.9-9.9v-.2L3.7 1.7z"/><path fill="#FFD500" d="m17.1 16.7-3.5-3.5v-.2l3.5-3.5.1.1 4.2 2.4c1.2.7 1.2 1.8 0 2.4z"/><path fill="#FF3A44" d="m17.2 16.6-3.6-3.6-10 10c.4.4 1 .5 1.8.1z"/><path fill="#00C853" d="M17.2 7.4 5.4.9C4.6.5 4 .5 3.6 1l10 10z"/></svg>
              <span><span class="sb-kicker" data-ko="다운로드" data-en="Get it on">Get it on</span>Google Play</span>
            </a>
          </div>
          <p class="note"
             data-ko="가입 없음 · 서버 없음 · 전부 기기 안에. 결과는 인연 고유의 사주 산식에 따른 것으로, 엔터테인먼트 목적으로 제공됩니다."
             data-en="No sign-up, no servers — everything stays on your device. Results come from Inyeon's own Saju formula and are provided for entertainment purposes."></p>
        </article>

        <article class="prod voice">
          <div class="prod-head">
            <div class="prod-ic voice">聲</div>
            <div>
              <h3 data-ko="내 진짜 목소리" data-en="My Voice Coach"></h3>
              <div class="prod-sub" data-ko="My Voice Coach · 음역대 진단" data-en="내 진짜 목소리 · vocal range check"></div>
            </div>
          </div>
          <p class="prod-desc"
             data-ko="마이크로 목소리를 측정해 타고난 음역대를 찾고, 평소 말할 때의 톤이 그 음역대에 얼마나 가까운지 알려줍니다. 세 단계, 약 40초."
             data-en="Measures your voice through the mic to find your natural range, then shows how close your everyday speaking tone sits to it. Three steps, about 40 seconds."></p>
          <ul class="feat">
            <li><span class="dot"></span><span
                data-ko="<b>보이스 타입</b> — 베이스 · 바리톤 · 테너 · 알토 · 메조소프라노 · 소프라노"
                data-en="<b>Voice type</b> — bass, baritone, tenor, alto, mezzo-soprano, soprano"></span></li>
            <li><span class="dot"></span><span
                data-ko="<b>타고난 음고 vs 평소 음고</b> — 그 차이에 맞춘 조언과 성대 건강 팁"
                data-en="<b>Natural vs. everyday pitch</b> — advice tuned to the gap, plus vocal-health tips"></span></li>
            <li><span class="dot"></span><span
                data-ko="<b>내 음역대의 노래</b> — 편하게 부를 곡과 도전곡, 노래방 키 조절값까지"
                data-en="<b>Songs in your range</b> — comfortable picks, stretch picks, and karaoke key offsets"></span></li>
            <li><span class="dot"></span><span
                data-ko="<b>기기 안에서만 분석</b> — 녹음하지 않고, 전송하지도 않습니다"
                data-en="<b>Analyzed on-device only</b> — nothing recorded, nothing sent"></span></li>
          </ul>

<script>
  function setLang(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-ko]').forEach(function (el) {
      var val = el.getAttribute('data-' + lang);
      if (val !== null) el.innerHTML = val;
    });
    document.getElementById('btn-ko').classList.toggle('active', lang === 'ko');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    try { localStorage.setItem('hw-lang', lang); } catch (e) {}
  }
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('hw-lang'); } catch (e) {}
    var initial = saved || ((navigator.language || 'ko').toLowerCase().startsWith('ko') ? 'ko' : 'en');
    setLang(initial);
  })();
</script>
